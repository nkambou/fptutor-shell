<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>HaskellTutor · parcours</title>
<style>
  body{font-family:"DejaVu Sans",Arial,sans-serif;font-size:13px;margin:0;padding:14px;
       background:#f6f8fa;color:#1a1a1a}
  .bandeau{background:#16283c;color:#fff;padding:9px 12px;border-radius:5px;font-size:14px;
           margin-bottom:12px;overflow:hidden}
  /* Seuls l'identite (#ent) et le choix de langue (.lang) vont a droite. La regle
     visait tous les span du bandeau, y compris la barre entre EN et FR : ils se
     collaient et les espaces disparaissaient. */
  .bandeau #ent, .bandeau .lang{float:right;font-size:12.5px;opacity:.95}
  /* .lang flotte a gauche de #ent : l'espace qui les separe est a sa droite */
  .bandeau .lang{margin-right:22px}
  .bandeau .lang .sep{opacity:.5;margin:0 7px}
  .etapes{margin-bottom:11px;font-size:11.5px;color:#5c6b7a}
  .etapes b{display:inline-block;padding:3px 10px;border-radius:12px;background:#e3e9ef;
            color:#8fa3b8;margin-right:6px;font-weight:normal}
  .etapes b.on{background:#16283c;color:#fff}.etapes b.fait{background:#3f5d7d;color:#fff}
  .rangee{display:flex;align-items:flex-start;gap:12px}
  .g{flex:0 0 24%}.c{flex:1 1 auto}.d{flex:0 0 27%}
  .carte{background:#fff;border:1px solid #c3cdd8;border-radius:5px;margin-bottom:11px}
  .titre{background:#16283c;color:#fff;padding:5px 10px;font-size:12px;border-radius:4px 4px 0 0;
         overflow:hidden}
  .titre b{float:right;font-weight:normal;opacity:.92}
  .titre.or{background:#3f5d7d}.titre.ve{background:#3f5d7d}.titre.gr{background:#8fa3b8}
  .corps{padding:9px 10px}
  code,pre,textarea{font-family:"DejaVu Sans Mono",monospace}
  textarea{width:100%;min-height:140px;font-size:12.5px;border:1px solid #c3cdd8;border-radius:4px;
           padding:7px;line-height:1.5;color:#16283c;resize:vertical}
  textarea.court{min-height:70px}
  pre{font-size:11.5px;margin:0;white-space:pre-wrap;line-height:1.45}
  .ok{color:#3f5d7d}.err{color:#3f5d7d}
  button{background:#16283c;color:#fff;border:0;padding:7px 14px;border-radius:4px;font-size:12.5px;
         cursor:pointer;margin-right:6px;margin-top:4px}
  button.sec{background:#fff;color:#16283c;border:1.5px solid #16283c}
  button:disabled{background:#c3cdd8;color:#5c6b7a;cursor:not-allowed}
  input{padding:6px 7px;border:1px solid #c3cdd8;border-radius:4px;font-family:inherit;
        font-size:13px;width:96%;margin-bottom:8px}
  .opt{display:inline-block;padding:4px 11px;border-radius:4px;border:1px solid #c3cdd8;
       margin-right:5px;background:#fff;color:#8fa3b8;font-size:12px;cursor:pointer}
  .opt.on{background:#16283c;color:#fff;border-color:#16283c}
  .enonce{border-left:2px solid #8fa3b8;background:#f6f8fa;padding:8px 10px;border-radius:0 3px 3px 0;margin:9px 0;line-height:1.45;color:#16283c}
  .enonce.att{border-left-color:#3f5d7d;background:#eef2f6}
  .palier{font-size:11.5px;margin-bottom:6px}
  .palier .p{font-weight:bold;color:#16283c}
  .cpt{display:block;margin:2px 0 2px 10px;color:#16283c}
  .etat{display:inline-block;min-width:72px;text-align:center;font-size:10px;border-radius:3px;
        padding:1px 4px;margin-right:5px;color:#fff}
  .e0{background:#c3cdd8;color:#8fa3b8}.e1{background:#8fa3b8}.e2{background:#3f5d7d}
  .e3{background:#16283c}.eh{background:#e3e9ef;color:#8fa3b8}
  table.al{width:100%;border-collapse:collapse;font-size:12px;font-family:"DejaVu Sans Mono",monospace}
  table.al td{padding:3px 5px;border-bottom:1px solid #eef2f6}
  table.al td.n{font-family:"DejaVu Sans",Arial,sans-serif;color:#8fa3b8;width:95px}
  .pair{display:flex;align-items:center;gap:9px;padding:5px 3px;border-bottom:1px solid #eef2f6;
        font-size:12px}
  .pair .st{margin-left:auto;font-size:11px;color:#5c6b7a}
  .dec{font-size:11.5px;line-height:1.5}
  .choix{background:#eef2f6;border:1px solid #8fa3b8;border-radius:4px;padding:5px 7px;
         margin-top:5px;display:block;color:#3f5d7d}
  .etat{font-family:"DejaVu Sans Mono",monospace;font-size:11.5px;margin:7px 0;color:#16283c}
  .etat.err{color:#8a2f2f}
  .note{font-size:11px;color:#5c6b7a;line-height:1.45;margin-top:7px}
  .jauge{height:9px;background:#eef2f6;border-radius:5px;overflow:hidden;margin:5px 0 3px}
  .jauge i{display:block;height:100%;background:#16283c;border-radius:5px}
  .jauge.v i{background:#3f5d7d}
  .etapem{display:flex;gap:4px;margin-top:6px;font-size:10.5px;text-align:center}
  .etapem div{flex:1;padding:3px 2px;border-radius:3px;background:#eef2f6;color:#5c6b7a}
  .etapem div.on{background:#16283c;color:#fff}
  .etapem div.fait{background:#3f5d7d;color:#fff}
  .tuteur{border-left:5px solid #16283c;background:#eef2f6;padding:8px 10px;
          border-radius:0 4px 4px 0;margin:9px 0;line-height:1.45;color:#16283c}
  .tuteur.ko{border-left-color:#16283c;background:#e3e9ef;color:#16283c}
  .tuteur.hf{border-left:5px double #16283c;background:#eef2f6;color:#16283c}
  .verif{border:1px solid #c3cdd8;border-radius:5px;padding:9px 11px;margin-top:9px;
         background:#fbfcfd}
  .verif p{margin:0 0 7px}
  .verif .q{font-size:12.5px;margin:8px 0 4px}
  .verif label{display:block;font-size:12px;margin:2px 0;cursor:pointer}
  .verif input{width:auto;margin-right:6px}
  .tuteur b{display:block;margin-bottom:2px}
  .sol{border-bottom:1px solid #eef2f6;padding:5px 2px;font-size:11.5px}
  .sol .a{color:#16283c;cursor:pointer;text-decoration:underline}
  .minuteur{float:right;font-size:11.5px;color:#5c6b7a}
  .minuteur.court{color:#3f5d7d;font-weight:bold}
  /* ---------------------------------------------------------------- parcours
     Une seule colonne centree, des textes plus grands, et une barre de
     progression fixee en haut : l'essentiel reste visible en tout temps. */
  .page{max-width:960px;margin:0 auto}
  .page, .page .corps{font-size:15px;line-height:1.55}
  .page .carte{border-radius:8px;margin-bottom:16px}
  .page .titre{font-size:15px;padding:9px 14px;border-radius:7px 7px 0 0}
  .page .corps{padding:14px 16px}
  .page .enonce{font-size:16px;padding:12px 14px;margin:4px 0 12px}
  .page .note{font-size:13.5px}
  .page button{font-size:15px;padding:9px 18px;border-radius:6px}
  .page pre{font-size:13.5px}
  .page .tuteur{font-size:15px;padding:11px 14px}
  .page .etat{font-size:14px}
  .page table.al{font-size:14px}
  .page table.al td{padding:6px 8px}
  .page table.al td.n{width:auto;font-size:13.5px}
  /* barre de progression, collee en haut de l'ecran */
  .suivi{position:sticky;top:0;z-index:20;background:#16283c;color:#fff;border-radius:8px;
         padding:10px 16px;margin-bottom:16px;box-shadow:0 2px 8px rgba(22,40,60,.25)}
  .suivi .ligne{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .suivi .etapes3{display:flex;gap:6px;flex:1 1 320px}
  .suivi .etapes3 div{flex:1;text-align:center;padding:6px 4px;border-radius:5px;font-size:14px;
                      background:rgba(255,255,255,.12);color:#c3cdd8}
  .suivi .etapes3 div.on{background:#fff;color:#16283c;font-weight:bold}
  .suivi .etapes3 div.fait{background:#3f5d7d;color:#fff}
  .suivi .compte{font-size:15px;flex:1 1 240px}
  .suivi .compte b{font-size:17px}
  .suivi .jauge{background:rgba(255,255,255,.18);height:8px;margin:6px 0 0}
  .suivi .jauge i{background:#8fd18f}
  .suivi button.sec{background:transparent;color:#fff;border:1.5px solid #8fa3b8;
                    font-size:13px;padding:5px 12px;margin:0}
  .suivi .minuteur{float:none;color:#fff;font-size:14px}
  /* le reste, replie sous l'exercice */
  details.plus{margin-top:6px}
  details.plus > summary{cursor:pointer;font-size:15px;color:#16283c;padding:10px 4px;
                         list-style-position:inside}
  .bas{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;
       align-items:start;margin-top:8px}
  /* Code fourni (non modifiable) et zone ou l'etudiant ecrit sa fonction. */
  .lbl{font-size:14px;color:#3f5d7d;margin:14px 0 6px}
  .lbl.ecrire{color:#16283c;font-weight:bold;font-size:16px}
  pre.fourni{background:#eef2f6;border:1px dashed #8fa3b8;border-radius:6px;padding:10px 12px;
             color:#5c6b7a;font-size:13.5px;line-height:1.5}
  textarea.code{border:2px solid #16283c;background:#fff;resize:none;overflow:hidden;
                min-height:170px;font-size:15px;padding:10px 12px;border-radius:6px}
  textarea.code:focus{outline:3px solid #8fa3b8}
  details.tech summary{cursor:pointer;font-size:13px;color:#5c6b7a;margin-top:6px}
  .legende{font-size:13px;color:#5c6b7a;margin-top:6px;line-height:1.45}
  table.al th{text-align:left;font-family:"DejaVu Sans",Arial,sans-serif;font-weight:normal;
              font-size:13px;color:#5c6b7a;padding:6px 8px;border-bottom:1px solid #c3cdd8}
  .actions{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap}
  .actions button{margin:0}

  /* ------------------------------------------------ couleurs et mise en page v3
     Moins de bleu fonce, et des couleurs qui ont un sens : bleu pour agir, vert
     pour la progression et la reussite, orange pour les indices, rouge pale pour
     les erreurs. */
  .page{max-width:1400px}
  .page textarea, .page pre, .page input{box-sizing:border-box}
  body{background:#f3f5f9}
  .page .carte{border:1px solid #dde3ea;box-shadow:0 1px 3px rgba(22,40,60,.06)}
  .page .titre{background:#fff;color:#16283c;border-bottom:1px solid #e3e8ef;font-weight:bold}
  .page .titre b{color:#5c6b7a}
  .page .titre.gr, .page .titre.ve, .page .titre.or{background:#fff;color:#16283c}
  .page .enonce{background:#f7f9fc;border-left:4px solid #2563eb;color:#16283c}
  .page button{background:#2563eb}
  .page button:hover{background:#1d4ed8}
  .page button.sec{background:#fff;color:#1d4ed8;border:1.5px solid #93b4f5}
  .page button.sec:hover{background:#eef4ff}
  .page button.indice{background:#fff;color:#b45309;border:1.5px solid #f2b866}
  .page button.indice:hover{background:#fff7e6}
  .page button:disabled, .page button.indice:disabled{background:#e5e9ef;color:#8fa3b8;
    border-color:#e5e9ef}
  .page .tuteur{background:#eef4ff;border-left:5px solid #2563eb;color:#16283c}
  .page .tuteur.ko{background:#fdf0f0;border-left-color:#d14b4b}
  .page .tuteur.hf{background:#fff7e6;border-left:5px solid #d99a1e}
  .page .etat.ok{color:#15803d;font-weight:bold}
  .page .etat.err{color:#b42318}
  .page pre.err{background:#fbfbfc;border:1px solid #e3e8ef;border-radius:6px;padding:10px 12px;
                color:#3a4655}
  .page .enonce b{color:#b45309}
  .suivi{background:#16283c}
  .suivi .jauge i{background:#4ade80}
  .suivi .etapes3 div.fait{background:#15803d}
  /* l'exercice en deux colonnes : a gauche ce qu'on lit, a droite ce qu'on ecrit */
  .exo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;
       align-items:start}
  .exo > div{min-width:0}
  @media (max-width:1100px){ .exo{grid-template-columns:1fr} }
  .lbl.ecrire{display:inline-block;background:#e8f0fe;color:#1d4ed8;border-radius:5px;
              padding:4px 10px;margin-top:0}
  textarea.code{border:2px solid #2563eb;min-height:120px}
  textarea.code:focus{outline:3px solid #bfd3fb}
  pre.fourni{max-height:none}

  /* ------------------------------------------------ contrastes renforces v4 */
  .page .titre{border-left:5px solid #2563eb;font-size:16px}
  .page .enonce{background:#e8f0fe;border-left:5px solid #2563eb;color:#0f1f33}
  .page .enonce code{color:#0f1f33;font-weight:bold}
  .page .lbl{color:#334155;font-weight:bold}
  pre.fourni{background:#f1f5f9;border:1px solid #cbd5e1;color:#1e293b}
  .lbl.ecrire{background:#2563eb;color:#fff;padding:6px 12px}
  .lbl.ecrire code{color:#fff;background:rgba(255,255,255,.18);padding:0 4px;border-radius:3px}
  textarea.code{color:#0f1f33;border-color:#2563eb;background:#fff}
  .page button.indice{background:#fff7e6;color:#9a4a00;border:2px solid #f59e0b;font-weight:bold}
  .page button.indice:hover{background:#ffedc2}
  .page .legende{color:#475569}
  /* barre du haut : deux lignes bien espacees, les etapes puis le compte */
  .suivi{padding:14px 20px}
  .suivi .ligne{display:block}
  .suivi .etapes3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
  .suivi .etapes3 div{padding:9px 10px;font-size:15px;background:#2c4560;color:#e2e8f0;
                      border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .suivi .etapes3 div.on{background:#2563eb;color:#fff;font-weight:bold}
  .suivi .etapes3 div.fait{background:#15803d;color:#fff}
  .suivi .bas2{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  .suivi .compte{flex:1 1 300px;font-size:15px}
  .suivi .compte b{font-size:18px}
  .suivi .jauge{height:12px;background:#3b5672;border-radius:6px;margin:8px 0 4px}
  .suivi .jauge i{background:#4ade80;border-radius:6px}
  .suivi .aide-ligne{font-size:13px;color:#cbd5e1}
  .suivi button.sec{background:transparent;border-color:#cbd5e1;color:#fff;font-size:14px;
                    padding:6px 16px}
  .suivi button.sec:hover{background:rgba(255,255,255,.12)}
  @media (max-width:800px){ .suivi .etapes3 div{white-space:normal} }

  /* ------------------------------------------------ inscription et reprise */
  .accueil{max-width:640px;margin:20px auto}
  .accueil .corps{padding:20px 24px}
  .accueil label{display:block;font-size:14px;font-weight:bold;color:#334155;margin:4px 0 6px}
  .accueil input{width:100%;box-sizing:border-box;font-size:16px;padding:11px 12px;
                 margin-bottom:18px;border:1.5px solid #cbd5e1;border-radius:6px}
  .accueil input:focus{outline:3px solid #bfd3fb;border-color:#2563eb}
  .accueil .actions{margin-top:6px}
  .memo{background:#fff7e6;border:2px solid #f59e0b;border-radius:8px;padding:12px 14px;
        margin:4px 0 18px;color:#5b3a00;font-size:15px;line-height:1.5}
  .memo b.gros{display:block;font-size:16px;margin-bottom:4px;color:#7a4300}
  .memo .code{font-family:"DejaVu Sans Mono",monospace;font-size:20px;font-weight:bold;
              background:#fff;border:1px dashed #f59e0b;border-radius:5px;padding:2px 10px;
              color:#16283c;letter-spacing:2px}
  .accueil .note{font-size:13.5px;margin-top:10px}
  .accueil .opt{font-size:15px;padding:9px 18px;border-radius:6px;margin:0 8px 8px 0;
                color:#1d4ed8;border:1.5px solid #93b4f5}
  .accueil .opt.on{background:#2563eb;color:#fff;border-color:#2563eb}
  /* ------------------------------------------------ palette sobre v5
     Fond papier, encre anthracite, une seule couleur d'action (vert sarcelle),
     ocre pour les indices. Remplace le bleu vif et le bleu marine. */
  body{background:#f5f3ee;color:#1f2933}
  .bandeau{background:#26323d}
  .page .carte, .accueil .carte{background:#fff;border:1px solid #e2ddd3;box-shadow:none}
  .page .titre{background:#fff;color:#1f2933;border-left:4px solid #0f6e66;
               border-bottom:1px solid #ebe6dc}
  .page .titre.gr, .page .titre.ve, .page .titre.or{background:#fff;color:#1f2933}
  .page button, .accueil button{background:#0f6e66}
  .page button:hover, .accueil button:hover{background:#0b5a53}
  .page button.sec, .accueil button.sec{background:#fff;color:#0f6e66;border:1.5px solid #9cc7c1}
  .page button.sec:hover, .accueil button.sec:hover{background:#eef6f5}
  .page button.indice{background:#fdf6e9;color:#8a4b0f;border:1.5px solid #d9a35a}
  .page button.indice:hover{background:#f9ebd2}
  .lbl.ecrire{background:#0f6e66}
  textarea.code{border-color:#0f6e66}
  textarea.code:focus{outline:3px solid #cfe5e2}
  .accueil input:focus{outline:3px solid #cfe5e2;border-color:#0f6e66}
  .accueil .opt{color:#0f6e66;border-color:#9cc7c1}
  .accueil .opt.on{background:#0f6e66;border-color:#0f6e66;color:#fff}
  .page .enonce{background:#f3f8f7;border-left:4px solid #0f6e66}
  .page .tuteur{background:#f3f8f7;border-left:5px solid #0f6e66}
  .page .tuteur.ko{background:#fbf1ee;border-left-color:#b5513c}
  .page .tuteur.hf{background:#fdf6e9;border-left-color:#c98a2b}
  .memo{background:#fdf6e9;border-color:#d9a35a;color:#5a3a12}
  .memo .code{border-color:#d9a35a}
  pre.fourni{background:#f7f6f2;border:1px solid #e2ddd3;color:#2d3a45}
  .suivi{background:#26323d;box-shadow:none}
  .suivi .etapes3 div{background:#34424f;color:#d7dde3}
  .suivi .etapes3 div.on{background:#0f6e66;color:#fff}
  .suivi .etapes3 div.fait{background:#4d7c5a;color:#fff}
  .suivi .jauge{background:#3d4b58}
  .suivi .jauge i{background:#7fc4a0}
  /* v6 : harmonie. La barre de progression devient claire (comme les cartes) au
     lieu d'un bloc gris-bleu froid qui jurait avec le fond papier et le vert
     sarcelle ; le bandeau passe a un gris fonce neutre, sans bleu. */
  .bandeau{background:#2b2f31}
  .suivi{background:#fff;color:#1f2933;border:1px solid #e2ddd3}
  .suivi .etapes3 div{background:#f1eee7;color:#5f6b72}
  .suivi .etapes3 div.on{background:#0f6e66;color:#fff}
  .suivi .etapes3 div.fait{background:#dcebe8;color:#0f5a53}
  .suivi .compte b{color:#0f6e66}
  .suivi .jauge{background:#ebe7de}
  .suivi .jauge i{background:#0f6e66}
  .suivi .aide-ligne{color:#5f6b72}
  .suivi .minuteur{color:#5f6b72}
  .suivi button.sec, .page .suivi button.sec{background:#fff;color:#0f6e66;
    border:1.5px solid #9cc7c1}
  .suivi button.sec:hover, .page .suivi button.sec:hover{background:#eef6f5}
  /* la consigne, en haut de l'exercice et sur toute la largeur */
  .consigne{background:#f3f8f7;border:1px solid #cfe5e2;border-left:6px solid #0f6e66;
            border-radius:6px;padding:14px 18px;margin:2px 0 18px}
  .consigne .etiq{display:inline-block;font-size:12.5px;font-weight:bold;letter-spacing:.06em;
                  text-transform:uppercase;color:#0f6e66;margin-bottom:6px}
  .consigne .texte{font-size:18px;line-height:1.5;color:#1f2933}
  .consigne .sig{display:inline-block;margin-top:10px;font-family:"DejaVu Sans Mono",monospace;
                 font-size:15px;background:#fff;border:1px solid #cfe5e2;border-radius:5px;
                 padding:4px 10px;color:#1f2933}
  /* tableau des resultats des tests */
  table.tests{margin:8px 0 4px;background:#fff;border:1px solid #e3e8ef;border-radius:6px}
  table.tests td{padding:6px 10px}
  table.tests tr.rate td:first-child{color:#b42318;font-weight:bold}
  table.tests tr.rate{background:#fdf0f0}
  table.tests tr.reussi td:first-child{color:#15803d;font-weight:bold}
</style>
</head>
<body>

<div class="bandeau">HaskellTutor · parcours vers la programmation fonctionnelle
  <span id="ent">non inscrit</span></div>

<div class="etapes" id="etapes" style="display:none">
  <b id="et1">1 · Inscription</b><b id="et2">2 · Mode de travail</b><b id="et3">3 · Groupe</b>
  <b id="et4">4 · Exercices</b></div>

<div id="ecran"></div>

<script>
let ident = null, vue = null, pairs = null, etape = 1;

const LANG_PARAM = new URLSearchParams(location.search).get("lang");
const LANG = (LANG_PARAM === "fr" || LANG_PARAM === "en")
  ? LANG_PARAM
  : (window.LANGUE_DEFAUT === "en" ? "en" : "fr");
let CAT = null;

async function chargerTextes(){
  if (LANG === "fr") { CAT = null; return; }
  try {
    CAT = await (await fetch("/api/textes")).json();
    CAT.ordre = Object.keys(CAT.phrases).sort((a, b) => b.length - a.length);
  } catch (e) { CAT = null; }
}

function tr(t){
  if (!CAT || typeof t !== "string" || !t.trim()) return t;
  let bouts = [[t, false]];
  for (const fr of CAT.ordre) {
    if (bouts.every(([x, f]) => f || x.indexOf(fr) < 0)) continue;
    const en = CAT.phrases[fr], suite = [];
    for (const [txt, fige] of bouts) {
      if (fige || txt.indexOf(fr) < 0) { suite.push([txt, fige]); continue; }
      const parts = txt.split(fr);
      parts.forEach((pp, i) => { if (i) suite.push([en, true]); if (pp) suite.push([pp, false]); });
    }
    bouts = suite;
  }
  let out = bouts.map(([x]) => x).join("");
  for (const [fr, en] of Object.entries(CAT.etiquettes || {})) {
    if (fr !== en) out = out.replace(new RegExp("(?<![\\w-])" + fr + "(?![\\w-])", "g"), en);
  }
  return out;
}

// La traduction s'applique aux noeuds de texte du document, apres chaque rendu.
// Les balises de code sont laissees telles quelles : le code de l'apprenant et
// la sortie du compilateur ne se traduisent pas.
const SANS_TRADUCTION = new Set(["CODE", "PRE", "TEXTAREA", "SCRIPT", "STYLE"]);
function traduireDOM(racine){
  if (!CAT) return;
  const p = document.createTreeWalker(racine || document.body, NodeFilter.SHOW_TEXT, {
    acceptNode(n){
      let e = n.parentElement;
      while (e) { if (SANS_TRADUCTION.has(e.tagName)) return NodeFilter.FILTER_REJECT;
                  e = e.parentElement; }
      return n.nodeValue.trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
    }});
  const cibles = [];
  while (p.nextNode()) cibles.push(p.currentNode);
  for (const n of cibles) { const v = tr(n.nodeValue); if (v !== n.nodeValue) n.nodeValue = v; }
  document.querySelectorAll("[placeholder]").forEach(x =>
    x.setAttribute("placeholder", tr(x.getAttribute("placeholder"))));
  document.querySelectorAll("button, option").forEach(x => {
    if (!x.children.length) { const v = tr(x.textContent); if (v !== x.textContent) x.textContent = v; }
  });
}

        VERSION_ATTENDUE + ".</b> Arrêtez le serveur et relancez-le depuis le dossier " +
        "où vous avez copié les nouveaux fichiers.");
  } catch (e) {
    alerteServeur("<b>Le serveur ne répond pas à /api/version.</b> Il s'agit " +
      "probablement d'un ancien processus encore en écoute sur ce port. " +
      "Arrêtez-le (<code>pkill -f serveur.py</code>) puis relancez " +
      "<code>python3 serveur.py</code>.");
  }

async function api(route, corps) {
  const opt = corps ? {method:"POST", headers:{"Content-Type":"application/json"},
                       body: JSON.stringify(corps)} : {};
  let d;
  try {
    d = await (await fetch(route, opt)).json();
  } catch (e) {
    alerteServeur("<b>Le serveur n'a pas répondu</b> à " + route + ".");
    throw e;
  }
  if (d && d.erreur) {
    alerteServeur("<b>" + d.erreur + "</b> : la page attend une version plus récente " +
      "du serveur. Arrêtez le processus en cours et relancez <code>python3 serveur.py</code> " +
      "depuis le dossier contenant les nouveaux fichiers.");
  }
  return d;
}

// ------------------------------------------------- zone de code
// Le code de depart melange ce qui est fourni (le type, les donnees de test) et la
// fonction a ecrire. On les separe : le code fourni s'affiche en lecture seule, et
// la zone d'ecriture ne contient que la fonction. A la soumission, les deux parties
// sont recollees : le serveur recoit exactement le meme texte qu'avant.
const MARQUEURS_A_COMPLETER = ["a completer", "undefined"];
const DEBUTS_COMMENTAIRE = ["(*", "--", ";", "#"];
let CODE_FOURNI = "";

function decouperAmorce(amorce) {
  const lignes = String(amorce || "").split("\n");
  let i = -1;
  for (let k = lignes.length - 1; k >= 0; k--)
    if (MARQUEURS_A_COMPLETER.some(m => lignes[k].indexOf(m) >= 0)) { i = k; break; }
  if (i < 0) return {fourni: "", aEcrire: String(amorce || "")};
  // la fonction commence a sa ligne « let ... » et au commentaire qui la precede
  while (i > 0 && !/^\s*(let|define|\(define|def)\b/.test(lignes[i])
         && lignes[i - 1].trim() !== "") i--;
  while (i > 0 && DEBUTS_COMMENTAIRE.some(c => lignes[i - 1].trim().startsWith(c))) i--;
  return {fourni: lignes.slice(0, i).join("\n"), aEcrire: lignes.slice(i).join("\n")};
}

// Pour une solution deja ecrite : on retire le code fourni s'il figure en tete.
function decouperSolution(code, amorceOrigine) {
  const d = decouperAmorce(amorceOrigine);
  if (d.fourni && String(code).startsWith(d.fourni + "\n"))
    return {fourni: d.fourni, aEcrire: String(code).slice(d.fourni.length + 1)};
  return {fourni: "", aEcrire: String(code)};
}

// Le code fourni (colonne de gauche, sous l'enonce) et la zone d'ecriture
// (colonne de droite) sont produits separement, pour la mise en deux colonnes.
function blocFourni(d) {
  CODE_FOURNI = d.fourni;
  return d.fourni ?
    '<div class="lbl">Code fourni : il est déjà là, vous n\'avez pas à le modifier.</div>' +
    '<pre class="fourni">' + echapper(d.fourni.replace(/\s+$/, "")) + '</pre>' +
    '<div class="legende">Dans les messages d\'erreur, les numéros de ligne comptent ' +
    'aussi les lignes de ce code fourni.</div>' : "";
}
function blocEcriture(d) {
  return '<div class="lbl ecrire">Écrivez votre fonction ici' +
    (d.aEcrire.indexOf("a completer") >= 0 ?
      ', à la place de <code>failwith "a completer"</code>' : "") + '</div>' +
    '<textarea id="code" class="code" spellcheck="false" autocomplete="off" ' +
    'autocapitalize="off" oninput="ajusterZone(this)" onkeydown="tabulation(event)">' +

// La zone s'agrandit avec son contenu : pas de barre de defilement a l'interieur.
function ajusterZone(t) {
  if (!t) return;
  t.style.height = "auto";
  t.style.height = (t.scrollHeight + 6) + "px";
}
function ajusterZones() { ajusterZone(el("code")); ajusterZone(el("gen")); }

// La touche Tab insere deux espaces au lieu de quitter la zone.
function tabulation(ev) {
  if (ev.key !== "Tab") return;
  ev.preventDefault();
  const t = ev.target, a = t.selectionStart, b = t.selectionEnd;
  t.value = t.value.slice(0, a) + "  " + t.value.slice(b);
  t.selectionStart = t.selectionEnd = a + 2;
  ajusterZone(t);
}

function lancerMinuteur() {
  if (minuteur) clearInterval(minuteur);
  if (!vue.reste_secondes && vue.reste_secondes !== 0) return;
  let reste = vue.reste_secondes;
  const peindre = () => {
    const c = el("chrono"); if (!c) return;
    const m = Math.floor(Math.abs(reste) / 60), s = Math.abs(reste) % 60;
    c.className = "minuteur" + (reste <= 60 ? " court" : "");
    c.textContent = reste > 0 ?
      "temps restant " + m + " min " + (s < 10 ? "0" : "") + s :
      "délai dépassé de " + m + " min";
    reste -= 1;
  };
  peindre();
  minuteur = setInterval(peindre, 1000);
}

// La progression, toujours visible dans la barre du haut : l'etape en cours
// (ecrire, comparer, reutiliser) et un compte en une ligne, avec sa jauge.
function dessinerProgres() {
  const p = vue.progres; if (!p) return;
  const z = el("progres"), c = el("compte"); if (!z || !c) return;
  const etat = p.etat;
  const atelier = vue.decision === "abstraction" || vue.decision === "guidance";
  const etape = etat === "acquired" ? 3 : etat === "generalised" ? 3 : atelier ? 2 : 1;
  const cls = k => k < etape || etat === "acquired" ? "fait" : (k === etape ? "on" : "");
  z.innerHTML =
    '<div class="' + cls(1) + '">1 · Écrire des solutions</div>' +
    '<div class="' + cls(2) + '">2 · Trouver ce qu\'elles ont en commun</div>' +
    // Etiquette neutre : affichee des le premier exercice, « Le reutiliser » disait
    // d'avance a l'etudiant quoi faire de sa decouverte, alors que l'etude mesure
    // s'il la reutilise de lui-meme dans les exercices de transfert.
    '<div class="' + cls(3) + '">3 · Nouveaux exercices</div>';
  // Un compte simple et une barre, avec une phrase courte. L'interface d'origine
  // disait deja que le tuteur montre les solutions ensemble apres en avoir assez
  // (« Solutions au dossier : n sur 3 au minimum ») : on garde l'idee, sans chiffre
  // trompeur (l'atelier s'ouvre en general a la 4e solution, parfois a la 3e).
  let texte, pct, aide;
  if (etat === "acquired") {
    texte = '<b>Palier acquis</b>'; pct = 100; aide = "Bravo : ce palier est terminé.";
  } else if (etat === "generalised") {
    texte = 'Réutilisations : <b>' + p.reemplois + '</b> sur ' + p.reemplois_requis;
    pct = Math.round(100 * p.reemplois / Math.max(p.reemplois_requis, 1));
    // Phrase de l'interface d'origine, reprise telle quelle : elle dit la regle sans
    // donner de consigne de methode. « Resolvez ... en reutilisant » en etait une,
    // affichee pendant l'exercice de transfert, qui mesure le reemploi spontane.
    aide = "Une réutilisation ne compte que si vous employez ce que vous venez de " +
      "trouver, plutôt qu'une récursion écrite à la main.";
  } else if (atelier) {
    texte = 'Solutions réussies : <b>' + p.solutions + '</b>'; pct = 100;
    aide = "Le tuteur vous montre vos solutions ensemble : cherchez ce qu'elles ont en commun.";
  } else {
    texte = 'Solutions réussies : <b>' + p.solutions + '</b>';
    pct = Math.min(100, Math.round(100 * p.solutions / (Math.max(p.minimum, 1) + 1)));
    aide = "Quand vous en aurez écrit assez, le tuteur vous les montrera ensemble.";
  }
  c.innerHTML = texte + '<div class="jauge"><i style="width:' + pct + '%"></i></div>' +
    '<div class="aide-ligne">' + aide +
    (p.resolutions && etat === "instances" ? ' (' + p.resolutions +
      ' exercice(s) réussi(s) autrement, enregistré(s) à part)' : "") + '</div>';
}

    'après le délai fixé par votre enseignant. Elle est enregistrée comme telle ; ' +
    'elle compte quand même.</div>' + html;
  // Apres une reussite, le tuteur attend toujours que l'etudiant clique : il a le

      '\')">Répondre</button></div><div id="retourverif"></div></div>';

// Le resultat de chaque test, sur une ligne : l'appel teste (par exemple
// « bintree_count_leaves t0 »), la valeur obtenue, la valeur attendue. On extrait
// l'appel de l'expression de test, qui l'entoure de conversions en texte
// (string_of_int, String.concat...) dont l'etudiant n'a pas a se soucier.
function appelTeste(expr, nom) {
  const e = String(expr || ""), i = e.indexOf(nom + " ");
  if (i < 0) return e;
  let j = i + nom.length + 1;
  while (e[j] === " ") j++;
  if (e[j] === "(") {
    let p = 0, k = j;
    for (; k < e.length; k++) { if (e[k] === "(") p++; else if (e[k] === ")" && --p === 0) break; }
    return e.slice(i, k + 1);
  }
  const m = /^[\w'.]+/.exec(e.slice(j));
  return e.slice(i, j) + (m ? m[0] : "");
}
function tableauTests(tests, v, nom) {
  if (!tests || !tests.length || !v.attendu) return "";
  const vide = x => (x === "" ? "(vide)" : echapper(x));
  return '<table class="al tests"><tr><th></th><th>Test</th><th>Obtenu</th>' +
    '<th>Attendu</th></tr>' + tests.map((t, i) => {
      const o = v.obtenu ? v.obtenu[i] : undefined, a = v.attendu[i];
      const ok = o !== undefined && o === a;
      return '<tr class="' + (ok ? "reussi" : "rate") + '"><td>' + (ok ? "✓" : "✗") +
        '</td><td><code>' + echapper(appelTeste(t, nom)) + '</code></td><td>' +
        (o === undefined ? "(aucun)" : vide(o)) + '</td><td>' + vide(a) + '</td></tr>';
    }).join("") + '</table>' +
    '<div class="legende">Les arbres t0, t1, t2, t3 et example_tree sont définis dans le ' +
    'code fourni.</div>';
}

function annulerEnchainement() {
  if (window.__enchainement) clearInterval(window.__enchainement);
  const z = el("sortie");
  if (z) z.innerHTML += '<div class="note">Enchaînement suspendu. ' +
    '<button onclick="rafraichir()">Exercice suivant</button></div>';
}

async function repondreVerification(activite) {
  const reponses = {};
  document.querySelectorAll("#verif input:checked").forEach(i => {
    reponses[i.name.slice(2)] = i.value;
  });
  const r = await api("/api/verifier", {ident: ident, activite: activite, reponses: reponses});
  const z = el("retourverif");
  if (r.refus) { z.innerHTML = '<div class="note">' + r.refus + '</div>'; return; }
  z.innerHTML = '<div class="tuteur' + (r.statut === "expliquee" ? "" : " ko") + '">' +
    '<b>Le tuteur</b>' + r.message + '</div>' +
    r.retours.map(x => '<div class="note">' + (x.correct ? "✓ " : "· ") + x.suite +
      '</div>').join("") +
    '<div style="margin-top:8px"><button onclick="rafraichir()">Continuer</button></div>';
  traduireDOM();
}

async function pourquoiForme() {
  const r = await api("/api/pourquoi", {ident: ident,
    activite: vue.activite ? vue.activite.id : null});
  const z = el("pourquoi");
  if (z) z.innerHTML = '<div class="enonce" style="margin-top:8px;white-space:pre-line">' +
    r.texte + '</div>';
  traduireDOM();
}

async function demanderAide(contexte) {
  const z = el("aide") || el("aidelat");
  const r = await api("/api/aide", {ident: ident, contexte: contexte || "activite",
                                    activite: vue.activite ? vue.activite.id : null});
  if (r.refus) {
    z.innerHTML = '<div class="note">' + r.refus + '</div>' +
      (r.rappel && r.rappel.length ? '<div class="enonce">' + r.rappel.map((t, k) =>
        '<b>Indice ' + (k + 1) + '.</b> ' + t).join("<br>") + '</div>' : "");
    vue.aides_prises = r.sur;
  } else {
    z.innerHTML = '<div class="enonce"><b>Indice ' + r.niveau + ' sur ' + r.sur + '</b>' +
      (r.fonde_sur && r.fonde_sur !== "none" ?
        ' <span class="note">(à propos de votre dernière erreur : ' +
        libelleCategorie(r.fonde_sur) + ')</span>' : "") +
      '<br>' + r.texte + '</div>';
    vue.aides_prises = r.niveau;
  }
  const b = el("btnaide"); if (b) b.textContent = libelleAide();
  dessinerEtayage();
  traduireDOM();
}

  const d = document.querySelector("details.plus");
  if (d) d.open = true;

chargerTextes().then(async () => {
